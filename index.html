<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de Aviso Prévio</title>

  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;padding:20px}
    .container{max-width:460px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.12)}
    h2{text-align:center;margin:0 0 18px}
    label{display:block;margin-top:14px;font-weight:bold}
    input,select,button{width:100%;padding:11px;margin-top:6px;font-size:16px}
    button{margin-top:18px;background:#0b66ff;color:#fff;border:none;border-radius:8px;cursor:pointer}
    button:hover{filter:brightness(.95)}
    .resultado{margin-top:18px;padding:14px;background:#eef2f7;border-radius:10px;min-height:24px}
    .ok{color:#0b6b2e;font-weight:bold}
    .alerta{color:#b00020;font-weight:bold}
    .debug{
      margin-top:12px;padding:10px;border-radius:10px;background:#111;color:#fff;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size:12px;white-space:pre-wrap
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Calculadora de Aviso Prévio</h2>

    <label>Data de admissão</label>
    <input type="date" id="admissao" />

    <label>Data do desligamento</label>
    <input type="date" id="desligamento" />

    <label>Tipo de aviso</label>
    <select id="tipo">
      <option value="">Selecione</option>
      <option value="trabalhado">Aviso Trabalhado</option>
      <option value="indenizado">Aviso Indenizado</option>
    </select>

    <label>Data-base</label>
    <input type="date" id="dataBase" />

    <!-- ✅ onclick direto = sem chance de “não ligar o evento” -->
    <button type="button" onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado"></div>
    <div class="debug" id="debug">DEBUG: página carregou. Clique em CALCULAR.</div>
  </div>

  <script>
    function log(msg){ document.getElementById("debug").textContent = msg; }

    // Parse seguro para iPhone/Safari e PC
    function parseDateLocal(v){
      const parts = (v || "").split("-");
      if(parts.length !== 3) return null;
      const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
      if(!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }

    function addDays(dateObj, days){
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      d.setDate(d.getDate() + days);
      return d;
    }

    function anosCompletos(inicio, fim){
      let anos = fim.getFullYear() - inicio.getFullYear();
      const m = fim.getMonth() - inicio.getMonth();
      if(m < 0 || (m === 0 && fim.getDate() < inicio.getDate())) anos--;
      return anos < 0 ? 0 : anos;
    }

    function formatBR(d){ return d.toLocaleDateString("pt-BR"); }

    // ✅ REGRA DEFINIDA POR VOCÊ:
    // Trabalhado → projeta (30 + 3/ano)
    // Indenizado → NÃO projeta
    function calcular(){
      try{
        const admStr = document.getElementById("admissao").value;
        const desStr = document.getElementById("desligamento").value;
        const tipoAviso = document.getElementById("tipo").value;
        const baseStr = document.getElementById("dataBase").value;

        log("DEBUG: clique ✅\nadmissao=" + admStr + "\ndesligamento=" + desStr + "\ntipo=" + tipoAviso + "\ndataBase=" + baseStr);

        const res = document.getElementById("resultado");

        if(!admStr || !desStr || !tipoAviso || !baseStr){
          res.innerHTML = "⚠️ Preencha todos os campos.";
          return;
        }

        const adm = parseDateLocal(admStr);
        const des = parseDateLocal(desStr);
        const base = parseDateLocal(baseStr);

        if(!adm || !des || !base){
          res.innerHTML = "⚠️ Datas inválidas. Selecione pelo calendário.";
          return;
        }

        const anos = anosCompletos(adm, des);
        const diasProporcionais = anos * 3;
        const diasAviso = 30 + diasProporcionais;

        const dataConsiderada = (tipoAviso === "trabalhado") ? addDays(des, diasAviso) : des;

        const inicioPeriodo = addDays(base, -30);
        const cai = (dataConsiderada >= inicioPeriodo && dataConsiderada <= base);

        res.innerHTML = `
          📌 <strong>Anos completos trabalhados:</strong> ${anos}<br>
          📌 <strong>Dias proporcionais:</strong> ${diasProporcionais}<br>
          📌 <strong>Dias de aviso (total):</strong> ${diasAviso}<br>
          📅 <strong>Data considerada:</strong> ${formatBR(dataConsiderada)}<br><br>
          ${cai
            ? <span class="alerta">🚨 Cai no período da data-base</span>
            : <span class="ok">✅ NÃO cai no período da data-base</span>
          }
        `;

        log(document.getElementById("debug").textContent + "\n\nOK: calculou ✅");
      } catch(e){
        document.getElementById("resultado").innerHTML = "❌ Erro no script.";
        log("ERRO:\n" + (e && e.stack ? e.stack : e));
      }
    }
  </script>
</body>
</html>
